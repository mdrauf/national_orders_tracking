<!DOCTYPE html>
<html>

<head>
    <title>Manage Roles</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .roles-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.7s ease;
        }

        .roles-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .roles-header h2 {
            color: #60a5fa;
            font-size: 28px;
        }

        .add-role-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
            display: inline-block;
        }

        .add-role-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }

        .roles-table {
            width: 100%;
            border-collapse: collapse;
        }

        .roles-table th {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid rgba(59, 130, 246, 0.3);
        }

        .roles-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
        }

        .roles-table tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .action-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: 0.3s;
            text-decoration: none;
            margin-right: 5px;
        }

        .edit-btn {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .edit-btn:hover {
            background: rgba(59, 130, 246, 0.3);
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .no-roles {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
            font-size: 18px;
        }

        .no-roles-icon {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>Manage Roles</h2>
        <div>
            <a href="/admin/employees" class="btn btn-primary">Employees</a>
            <a href="/admin/dashboard" class="btn btn-primary">Dashboard</a>
            <a href="/logout" class="btn btn-danger">Logout</a>
        </div>
    </div>

    <div class="roles-container">
        <div class="roles-header">
            <h2>Roles</h2>
            <a href="/admin/role/add" class="add-role-btn">+ Add Role</a>
        </div>

        {% if roles %}
        <table class="roles-table">
            <thead>
                <tr>
                    <th>Role Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for role in roles %}
                <tr>
                    <td>{{ role.name }}</td>
                    <td>
                        <a href="/admin/role/edit/{{ role._id }}" class="action-btn edit-btn">Edit</a>
                        <a href="/admin/role/delete/{{ role._id }}" class="action-btn delete-btn" 
                           onclick="return confirm('Are you sure you want to delete this role?')">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <div class="no-roles">
            <div class="no-roles-icon">🏷️</div>
            <p>No roles found. Click "Add Role" to get started.</p>
        </div>
        {% endif %}
    </div>

    <!-- Elfsight WhatsApp Chat -->
    <script src="https://elfsightcdn.com/platform.js" async></script>
    <div class="elfsight-app-9be5e72d-c194-46fe-884f-372ae9c99558" data-elfsight-app-lazy></div>

</body>

</html>
