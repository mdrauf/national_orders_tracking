<!DOCTYPE html>
<html>

<head>

    <title>Add Order - Billing System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .billing-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            animation: fadeIn 0.5s ease;
        }

        .billing-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .billing-header h3 {
            color: #60a5fa;
            font-size: 20px;
        }

        .billing-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .billing-table th {
            background: rgba(59, 130, 246, 0.3);
            padding: 12px 10px;
            text-align: left;
            color: white;
            font-weight: 600;
            border-radius: 8px 8px 0 0;
        }

        .billing-table td {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .billing-table input,
        .billing-table select {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            outline: none;
            transition: 0.3s;
            margin-bottom: 0;
        }

        .billing-table input:focus,
        .billing-table select:focus {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.02);
        }

        .billing-table select option {
            background: #1e293b;
            color: white;
        }

        .billing-table .amount-field {
            background: rgba(16, 185, 129, 0.15);
            font-weight: 600;
            color: #34d399;
        }

        .billing-table .amount-field:focus {
            background: rgba(16, 185, 129, 0.25);
        }

        .remove-row-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            opacity: 0.7;
        }

        .remove-row-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .add-row-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-row-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }

        .total-section {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(6, 182, 212, 0.2));
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.5s ease;
        }

        .total-label {
            font-size: 18px;
            font-weight: 600;
        }

        .total-amount {
            font-size: 32px;
            font-weight: 700;
            color: #34d399;
            text-shadow: 0 0 20px rgba(52, 211, 153, 0.5);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeInRow {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .billing-row {
            animation: fadeInRow 0.4s ease;
        }

        .customer-info-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .customer-info-section .full-width {
            grid-column: 1 / -1;
        }

        .section-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #60a5fa;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 25px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            border-radius: 2px;
        }
    </style>

</head>

<body>

    <div class="navbar">

        <h2>Add New Order - Billing System</h2>

        <div>

            <a href="/admin/dashboard" class="btn btn-primary">
                Dashboard
            </a>

            <a href="/logout" class="btn btn-danger">
                Logout
            </a>

        </div>

    </div>

    <div class="form-container">

        <h2>Create New Order</h2>

        <form method="POST" id="billingForm">

            <div class="section-title">Customer Information</div>

            <div class="customer-info-section">
                <input type="text" name="customer_name" placeholder="Customer Name" required style="width: 100%; padding: 12px; border: none; border-radius: 8px; background: rgba(255, 255, 255, 0.12); color: white; outline: none; transition: 0.3s; height: 46px; box-sizing: border-box;">
                <div style="display: flex; align-items: stretch; gap: 8px;">
                    <input type="text" name="phone" id="phoneInput" placeholder="Customer Phone Number" required style="flex: 1; padding: 12px; border: none; border-radius: 8px; background: rgba(255, 255, 255, 0.12); color: white; outline: none; transition: 0.3s; height: 46px; box-sizing: border-box;">
                    <button type="button" onclick="searchCustomer()" style="background: linear-gradient(135deg, #3b82f6, #06b6d4); border: none; border-radius: 8px; width: 46px; height: 46px; cursor: pointer; color: white; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3); flex-shrink: 0;">
                        🔍
                    </button>
                </div>
                <textarea name="address" rows="2" placeholder="Customer Address" required class="full-width" style="width: 100%; padding: 12px; border: none; border-radius: 8px; background: rgba(255, 255, 255, 0.12); color: white; outline: none; transition: 0.3s; resize: vertical; box-sizing: border-box;"></textarea>
            </div>

            <div class="billing-section">
                <div class="billing-header">
                    <h3>Billing Details</h3>
                    <button type="button" class="add-row-btn" onclick="addBillingRow()">
                        <span>+</span> Add Product
                    </button>
                </div>

                <table class="billing-table" id="billingTable">
                    <thead>
                        <tr>
                            <th style="width: 12%;">Category</th>
                            <th style="width: 18%;">Model</th>
                            <th style="width: 20%;">Brand</th>
                            <th style="width: 10%;">Quantity</th>
                            <th style="width: 13%;">Rate (₹)</th>
                            <th style="width: 13%;">Amount (₹)</th>
                            <th style="width: 7%;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="billingBody">
                        <!-- Default 5 rows will be added by JavaScript -->
                    </tbody>
                </table>

                <div class="total-section">
                    <div class="total-label">Grand Total:</div>
                    <div class="total-amount" id="grandTotal">₹0.00</div>
                </div>
            </div>

            <textarea name="parcel_details" rows="3" placeholder="Additional Parcel Details (Optional)"></textarea>

            <button type="submit" class="submit-btn">
                Add Order
            </button>

        </form>

    </div>

    <!-- Elfsight WhatsApp Chat | Untitled WhatsApp Chat -->
    <script src="https://elfsightcdn.com/platform.js" async></script>
    <div class="elfsight-app-9be5e72d-c194-46fe-884f-372ae9c99558" data-elfsight-app-lazy"></div>

    <script>
        let rowCount = 0;

        function addBillingRow() {
            rowCount++;
            const tbody = document.getElementById('billingBody');
            const row = document.createElement('tr');
            row.className = 'billing-row';
            row.id = `row-${rowCount}`;

            let categoryOptions = '<option value="">Select Category</option>';
            if (categoriesData && Array.isArray(categoriesData)) {
                categoriesData.forEach(category => {
                    categoryOptions += `<option value="${category._id}">${category.name}</option>`;
                });
            }

            let brandOptions = '<option value="">Select Brand</option>';
            if (brandsData && Array.isArray(brandsData)) {
                brandsData.forEach(brand => {
                    brandOptions += `<option value="${brand._id}">${brand.name}</option>`;
                });
            }

            row.innerHTML = `
                <td>
                    <select name="category_${rowCount}" class="category-select" onchange="updateModels(this)">
                        ${categoryOptions}
                    </select>
                </td>
                <td>
                    <select name="model_${rowCount}" class="model-select">
                        <option value="">Select Model</option>
                    </select>
                </td>
                <td>
                    <select name="brand_${rowCount}" class="brand-select">
                        ${brandOptions}
                    </select>
                </td>
                <td>
                    <input type="number" name="quantity_${rowCount}" class="quantity-field" min="1" value="1" oninput="calculateAmount(${rowCount})">
                </td>
                <td>
                    <input type="number" name="rate_${rowCount}" class="rate-field" min="0" step="0.01" placeholder="0.00" oninput="calculateAmount(${rowCount})">
                </td>
                <td>
                    <input type="text" name="amount_${rowCount}" class="amount-field" id="amount-${rowCount}" readonly value="0.00">
                </td>
                <td>
                    <button type="button" class="remove-row-btn" onclick="removeRow(${rowCount})">✕</button>
                </td>
            `;

            tbody.appendChild(row);
            updateModels(row.querySelector('.category-select'));
            updateBrands(row.querySelector('.category-select'));
        }

        function removeRow(rowId) {
            const row = document.getElementById(`row-${rowId}`);
            if (row) {
                row.style.animation = 'fadeOut 0.3s ease';
                setTimeout(() => {
                    row.remove();
                    calculateTotal();
                }, 300);
            }
        }

        // Categories, models, and brands from database
        const categoriesData = {{ categories | tojson }} || [];
        const modelsData = {{ models | tojson }} || [];
        const brandsData = {{ brands | tojson }} || [];

        function updateModels(selectElement) {
            const categoryId = selectElement.value;
            const modelSelect = selectElement.closest('tr').querySelector('.model-select');
            const brandSelect = selectElement.closest('tr').querySelector('.brand-select');

            modelSelect.innerHTML = '<option value="">Select Model</option>';
            updateBrands(selectElement);

            if (categoryId && modelsData && Array.isArray(modelsData)) {
                const filteredModels = modelsData.filter(model =>
                    model.category_id && model.category_id === categoryId
                );

                filteredModels.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model.name;
                    option.textContent = model.name;
                    modelSelect.appendChild(option);
                });
            }
        }

        function updateBrands(selectElement) {
            const categoryId = selectElement.value;
            const brandSelect = selectElement.closest('tr').querySelector('.brand-select');

            brandSelect.innerHTML = '<option value="">Select Brand</option>';

            if (categoryId && brandsData && Array.isArray(brandsData)) {
                const filteredBrands = brandsData.filter(brand =>
                    brand.category_id && brand.category_id === categoryId
                );

                filteredBrands.forEach(brand => {
                    const option = document.createElement('option');
                    option.value = brand._id;
                    option.textContent = brand.name;
                    brandSelect.appendChild(option);
                });
            } else if (brandsData && Array.isArray(brandsData)) {
                // Show all brands if no category selected
                brandsData.forEach(brand => {
                    const option = document.createElement('option');
                    option.value = brand._id;
                    option.textContent = brand.name;
                    brandSelect.appendChild(option);
                });
            }
        }

        function calculateAmount(rowId) {
            const quantity = parseFloat(document.querySelector(`#row-${rowId} .quantity-field`).value) || 0;
            const rate = parseFloat(document.querySelector(`#row-${rowId} .rate-field`).value) || 0;
            const amount = quantity * rate;
            
            document.getElementById(`amount-${rowId}`).value = amount.toFixed(2);
            calculateTotal();
        }

        function calculateTotal() {
            let total = 0;
            const amountFields = document.querySelectorAll('.amount-field');

            amountFields.forEach(field => {
                total += parseFloat(field.value) || 0;
            });

            document.getElementById('grandTotal').textContent = `₹${total.toFixed(2)}`;
        }

        function searchCustomer() {
            const phoneInput = document.getElementById('phoneInput');
            const phone = phoneInput.value.trim();

            if (!phone) {
                alert('Please enter a phone number');
                return;
            }

            fetch(`/api/customer/${phone}`)
                .then(response => response.json())
                .then(data => {
                    if (data && data.customer_name) {
                        document.querySelector('input[name="customer_name"]').value = data.customer_name;
                        document.querySelector('textarea[name="address"]').value = data.address;
                    } else {
                        alert('Customer not found');
                    }
                })
                .catch(error => {
                    console.error('Error fetching customer:', error);
                    alert('Customer not found');
                });
        }

        // Initialize with 5 default rows
        document.addEventListener('DOMContentLoaded', function() {
            for (let i = 0; i < 5; i++) {
                addBillingRow();
            }

            // Add phone number auto-fill functionality
            const phoneInput = document.querySelector('input[name="phone"]');
            phoneInput.addEventListener('blur', function() {
                const phone = this.value.trim();
                if (phone.length >= 10) {
                    fetch(`/api/customer/${phone}`)
                        .then(response => response.json())
                        .then(data => {
                            if (data) {
                                document.querySelector('input[name="customer_name"]').value = data.customer_name;
                                document.querySelector('textarea[name="address"]').value = data.address;
                            }
                        })
                        .catch(error => console.error('Error fetching customer:', error));
                }
            });
        });

        // Add fadeOut animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeOut {
                from {
                    opacity: 1;
                    transform: translateX(0);
                }
                to {
                    opacity: 0;
                    transform: translateX(30px);
                }
            }
        `;
        document.head.appendChild(style);
    </script>

</body>

</html>
