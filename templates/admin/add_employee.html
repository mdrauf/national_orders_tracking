<!DOCTYPE html>
<html>

<head>
    <title>Add Employee</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .employee-form-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.7s ease;
        }

        .form-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .form-header h2 {
            color: #60a5fa;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group select option {
            background: #1e293b;
            color: white;
        }

        .photo-upload-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .photo-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #3b82f6;
            overflow: hidden;
        }

        .photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-preview span {
            font-size: 40px;
            color: #94a3b8;
        }

        .photo-input-wrapper {
            flex: 1;
        }

        .photo-input-wrapper input[type="file"] {
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
            width: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }

        .back-btn {
            display: inline-block;
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
            margin-right: 10px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>Add Employee</h2>
        <div>
            <a href="/admin/employees" class="btn btn-primary">Employees</a>
            <a href="/admin/dashboard" class="btn btn-primary">Dashboard</a>
            <a href="/logout" class="btn btn-danger">Logout</a>
        </div>
    </div>

    <div class="employee-form-container">
        <div class="form-header">
            <h2>Add New Employee</h2>
        </div>

        <form method="POST" enctype="multipart/form-data">
            <div class="photo-upload-section">
                <div class="photo-preview" id="photoPreview">
                    <span>📷</span>
                </div>
                <div class="photo-input-wrapper">
                    <label style="display: block; color: #94a3b8; font-size: 14px; margin-bottom: 8px;">Employee Photo</label>
                    <input type="file" name="photo" accept="image/*" onchange="previewPhoto(this)">
                </div>
            </div>

            <div class="form-group">
                <label>Employee Name *</label>
                <input type="text" name="employee_name" required placeholder="Enter employee name">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Phone Number *</label>
                    <input type="tel" name="phone" required placeholder="Enter phone number">
                </div>
                <div class="form-group">
                    <label>Role *</label>
                    <select name="role" required>
                        <option value="">Select Role</option>
                        {% for role in roles %}
                        <option value="{{ role.name }}">{{ role.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Salary Type *</label>
                    <select name="salary_type" required onchange="toggleSalaryPerDay(this)">
                        <option value="">Select Type</option>
                        <option value="per_day">Per Day</option>
                        <option value="variable">Variable Salary</option>
                    </select>
                </div>
                <div class="form-group" id="salaryPerDayGroup" style="display: none;">
                    <label>Salary Per Day (₹) *</label>
                    <input type="number" name="salary_per_day" min="0" step="0.01" placeholder="Enter salary per day">
                </div>
            </div>

            <div class="form-group">
                <label>ID Proof Document</label>
                <input type="file" name="id_proof" accept=".pdf,.jpg,.jpeg,.png">
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea name="address" placeholder="Enter employee address"></textarea>
            </div>

            <div class="action-buttons">
                <a href="/admin/employees" class="back-btn">← Back</a>
                <button type="submit" class="submit-btn">Add Employee</button>
            </div>
        </form>
    </div>

    <!-- Elfsight WhatsApp Chat -->
    <script src="https://elfsightcdn.com/platform.js" async></script>
    <div class="elfsight-app-9be5e72d-c194-46fe-884f-372ae9c99558" data-elfsight-app-lazy></div>

    <script>
        function previewPhoto(input) {
            const preview = document.getElementById('photoPreview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                }
                reader.readAsDataURL(input.files[0]);
            } else {
                preview.innerHTML = '<span>📷</span>';
            }
        }

        function toggleSalaryPerDay(select) {
            const salaryPerDayGroup = document.getElementById('salaryPerDayGroup');
            if (select.value === 'per_day') {
                salaryPerDayGroup.style.display = 'block';
            } else {
                salaryPerDayGroup.style.display = 'none';
            }
        }
    </script>

</body>

</html>
